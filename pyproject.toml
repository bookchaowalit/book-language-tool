[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-language-tool"
version = "0.1.0"
description = "A deterministic, local-first toy language compiler and interpreter"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
book-lang = "book_language_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
