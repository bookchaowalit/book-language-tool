name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint (pyflakes rules)
        run: pipx run ruff check --select F src tests
      - name: Type check (mypy --strict, config in pyproject.toml)
        run: pipx run --spec mypy==2.3.1 mypy
      - name: Check example program
        run: make check
      - name: Unit tests
        run: make test
      - name: Demo run
        run: make demo
      - name: Package installs and exposes CLI
        run: |
          python -m pip install .
          book-lang run examples/hello.book
          book-lang compile examples/hello.book --out "$RUNNER_TEMP/hello.ir.json"
          book-lang exec "$RUNNER_TEMP/hello.ir.json"
