# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# Replaces the previous ci.yml (Ruff, mypy --strict, unittest, CLI smoke run); every step it ran is kept below.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      python-version: "3.11" # lowest supported version (requires-python >=3.11, mypy python_version)
      # Non-editable install, as the old workflow's `pip install .`: the CLI smoke run below
      # exercises the built package, not the source tree.
      install-command: uv pip install ".[dev]"
      # mypy --strict over the configured files (src); `mypy .` would also pull in the tests.
      # Same pinned version as the shared workflow's default.
      typecheck-command: uv pip install mypy==2.4.0 && mypy
      # Unit + golden tests, then the CLI smoke run the old workflow did (check, run, compile, exec).
      test-command: >-
        python -m pytest -q
        && book-lang check examples/hello.book
        && book-lang run examples/hello.book
        && book-lang compile examples/hello.book --out "$RUNNER_TEMP/hello.ir.json"
        && book-lang exec "$RUNNER_TEMP/hello.ir.json"

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
